<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 302" width="100%" role="img">
<title>四旋翼只靠四个电机的转速差完成升降俯仰横滚偏航</title>
<desc>左侧为俯视图，标注四个电机编号与旋转方向；右侧列出升降、俯仰、横滚、偏航四个动作各自需要哪几个电机加速或减速。</desc>

<rect x="0" y="0" width="680" height="302" fill="#ffffff"/>
<text x="150" y="34" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#57606a">俯视图 · 机头朝上</text>

<line x1="150" y1="161" x2="90" y2="101" stroke="#8c959f" stroke-width="2"/>
<line x1="150" y1="161" x2="210" y2="101" stroke="#8c959f" stroke-width="2"/>
<line x1="150" y1="161" x2="90" y2="221" stroke="#8c959f" stroke-width="2"/>
<line x1="150" y1="161" x2="210" y2="221" stroke="#8c959f" stroke-width="2"/>

<line x1="150" y1="152" x2="150" y2="124" stroke="#57606a" stroke-width="1.5" marker-end="url(#ar3)"/>
<text x="150" y="114" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">机头</text>

<circle cx="150" cy="161" r="13" fill="#fbefff" stroke="#8250df" stroke-width="1"/>

<circle cx="90" cy="101" r="23" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
<text x="90" y="101" text-anchor="middle" dominant-baseline="central" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#1f2328">1</text>
<text x="90" y="136" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#0969da">CW</text>

<circle cx="210" cy="101" r="23" fill="#fff1e5" stroke="#bc4c00" stroke-width="1.5"/>
<text x="210" y="101" text-anchor="middle" dominant-baseline="central" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#1f2328">2</text>
<text x="210" y="136" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#bc4c00">CCW</text>

<circle cx="90" cy="221" r="23" fill="#fff1e5" stroke="#bc4c00" stroke-width="1.5"/>
<text x="90" y="221" text-anchor="middle" dominant-baseline="central" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#1f2328">3</text>
<text x="90" y="256" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#bc4c00">CCW</text>

<circle cx="210" cy="221" r="23" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
<text x="210" y="221" text-anchor="middle" dominant-baseline="central" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#1f2328">4</text>
<text x="210" y="256" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#0969da">CW</text>

<text x="150" y="288" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">对角两桨同向，反扭矩抵消</text>

<rect x="320" y="40" width="320" height="56" rx="8" fill="#f5f7fa" stroke="#d8dee6" stroke-width="1"/>
<text x="336" y="62" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1f2328">升降 · 油门</text>
<text x="336" y="80" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#57606a">四个桨同时加速 / 同时减速</text>

<rect x="320" y="102" width="320" height="56" rx="8" fill="#f5f7fa" stroke="#d8dee6" stroke-width="1"/>
<text x="336" y="124" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1f2328">俯仰 · pitch</text>
<text x="336" y="142" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#57606a">1、2 慢，3、4 快 → 前倾，向前飞</text>

<rect x="320" y="164" width="320" height="56" rx="8" fill="#f5f7fa" stroke="#d8dee6" stroke-width="1"/>
<text x="336" y="186" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1f2328">横滚 · roll</text>
<text x="336" y="204" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#57606a">1、3 慢，2、4 快 → 右倾，向右飞</text>

<rect x="320" y="226" width="320" height="56" rx="8" fill="#f5f7fa" stroke="#d8dee6" stroke-width="1"/>
<text x="336" y="248" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1f2328">偏航 · yaw</text>
<text x="336" y="266" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#57606a">1、4 快，2、3 慢 → 机身转头</text>

<defs>
<marker id="ar3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
</svg>
