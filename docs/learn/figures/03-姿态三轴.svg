<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 238" width="100%" role="img">
<title>三个姿态角分别绕哪根轴转、产生什么运动</title>
<desc>三个俯视机体示意：滚转绕前后轴、俯仰绕左右轴、航向绕垂直轴，并注明各自造成左右移动、前后移动、机头转向。</desc>

<rect x="0" y="0" width="680" height="238" fill="#ffffff"/>
<text x="340" y="28" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#1f2328">三个姿态角：绕哪根轴转，机身就往哪里动</text>

<g>
<line x1="140" y1="66" x2="102" y2="86" stroke="#8c959f" stroke-width="2"/>
<line x1="140" y1="66" x2="178" y2="86" stroke="#8c959f" stroke-width="2"/>
<line x1="140" y1="174" x2="102" y2="154" stroke="#8c959f" stroke-width="2"/>
<line x1="140" y1="174" x2="178" y2="154" stroke="#8c959f" stroke-width="2"/>
<circle cx="102" cy="86" r="12" fill="#f5f7fa" stroke="#8c959f" stroke-width="1"/>
<circle cx="178" cy="86" r="12" fill="#f5f7fa" stroke="#8c959f" stroke-width="1"/>
<circle cx="102" cy="154" r="12" fill="#f5f7fa" stroke="#8c959f" stroke-width="1"/>
<circle cx="178" cy="154" r="12" fill="#f5f7fa" stroke="#8c959f" stroke-width="1"/>
<rect x="120" y="90" width="40" height="60" rx="13" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
<line x1="140" y1="58" x2="140" y2="182" stroke="#cf222e" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="140" y="52" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#cf222e">轴</text>
<text x="140" y="202" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1f2328">roll 滚转</text>
<text x="140" y="221" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">绕前后轴 · 左右平移</text>
</g>

<g>
<line x1="340" y1="66" x2="302" y2="86" stroke="#8c959f" stroke-width="2"/>
<line x1="340" y1="66" x2="378" y2="86" stroke="#8c959f" stroke-width="2"/>
<line x1="340" y1="174" x2="302" y2="154" stroke="#8c959f" stroke-width="2"/>
<line x1="340" y1="174" x2="378" y2="154" stroke="#8c959f" stroke-width="2"/>
<circle cx="302" cy="86" r="12" fill="#f5f7fa" stroke="#8c959f" stroke-width="1"/>
<circle cx="378" cy="86" r="12" fill="#f5f7fa" stroke="#8c959f" stroke-width="1"/>
<circle cx="302" cy="154" r="12" fill="#f5f7fa" stroke="#8c959f" stroke-width="1"/>
<circle cx="378" cy="154" r="12" fill="#f5f7fa" stroke="#8c959f" stroke-width="1"/>
<rect x="320" y="90" width="40" height="60" rx="13" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
<line x1="282" y1="120" x2="398" y2="120" stroke="#cf222e" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="404" y="124" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#cf222e">轴</text>
<text x="340" y="202" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1f2328">pitch 俯仰</text>
<text x="340" y="221" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">绕左右轴 · 前后平移</text>
</g>

<g>
<line x1="540" y1="66" x2="502" y2="86" stroke="#8c959f" stroke-width="2"/>
<line x1="540" y1="66" x2="578" y2="86" stroke="#8c959f" stroke-width="2"/>
<line x1="540" y1="174" x2="502" y2="154" stroke="#8c959f" stroke-width="2"/>
<line x1="540" y1="174" x2="578" y2="154" stroke="#8c959f" stroke-width="2"/>
<circle cx="502" cy="86" r="12" fill="#f5f7fa" stroke="#8c959f" stroke-width="1"/>
<circle cx="578" cy="86" r="12" fill="#f5f7fa" stroke="#8c959f" stroke-width="1"/>
<circle cx="502" cy="154" r="12" fill="#f5f7fa" stroke="#8c959f" stroke-width="1"/>
<circle cx="578" cy="154" r="12" fill="#f5f7fa" stroke="#8c959f" stroke-width="1"/>
<rect x="520" y="90" width="40" height="60" rx="13" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
<circle cx="540" cy="120" r="22" fill="none" stroke="#cf222e" stroke-width="1.5" stroke-dasharray="4 3"/>
<circle cx="540" cy="120" r="3" fill="#cf222e"/>
<text x="540" y="202" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1f2328">yaw 航向</text>
<text x="540" y="221" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">绕垂直轴 · 机头转向</text>
</g>

<defs>
<marker id="ar2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#cf222e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
</svg>
