<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="100%" role="img">
<title>一架无人机由空中的飞行器、中间的通信链路、地面的控制与保障设备三部分组成</title>
<desc>上层为空中飞行器，含机体结构、动力系统、飞控与传感器、通信与载荷四块；中间为通信链路；下层为地面设备，含遥控器、地面站、电源与备件、工具与记录。</desc>

<rect x="0" y="0" width="680" height="400" fill="#ffffff"/>
<text x="340" y="26" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#1f2328">一架能干活的无人机，其实是三块东西</text>

<rect x="40" y="44" width="600" height="104" rx="12" fill="#ddf4ff" stroke="#0969da" stroke-width="1"/>
<text x="56" y="66" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#0969da">① 空中 · 飞行器（你看到的那架飞机）</text>

<rect x="56" y="80" width="130" height="54" rx="6" fill="#ffffff" stroke="#0969da" stroke-width="0.8"/>
<text x="121" y="100" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#1f2328">机体结构</text>
<text x="121" y="119" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">机架 机臂</text>

<rect x="203" y="80" width="130" height="54" rx="6" fill="#ffffff" stroke="#0969da" stroke-width="0.8"/>
<text x="268" y="100" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#1f2328">动力系统</text>
<text x="268" y="119" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">电机 桨 电池</text>

<rect x="350" y="80" width="130" height="54" rx="6" fill="#ffffff" stroke="#0969da" stroke-width="0.8"/>
<text x="415" y="100" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#1f2328">飞控与传感器</text>
<text x="415" y="119" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">IMU GPS 罗盘</text>

<rect x="497" y="80" width="130" height="54" rx="6" fill="#ffffff" stroke="#0969da" stroke-width="0.8"/>
<text x="562" y="100" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#1f2328">通信与载荷</text>
<text x="562" y="119" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">图传 相机</text>

<line x1="340" y1="148" x2="340" y2="180" stroke="#57606a" stroke-width="1.5" marker-start="url(#arb)" marker-end="url(#arb)"/>

<rect x="40" y="180" width="600" height="44" rx="10" fill="#f5f7fa" stroke="#8c959f" stroke-width="1"/>
<text x="340" y="202" text-anchor="middle" dominant-baseline="central" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2328">② 中间 · 通信链路：遥控指令上去 · 遥测数据与视频画面下来</text>

<line x1="340" y1="224" x2="340" y2="256" stroke="#57606a" stroke-width="1.5" marker-start="url(#arb)" marker-end="url(#arb)"/>

<rect x="40" y="256" width="600" height="104" rx="12" fill="#dafbe1" stroke="#1a7f37" stroke-width="1"/>
<text x="56" y="278" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1a7f37">③ 地面 · 控制与保障（没有这块，飞机飞出去就回不来）</text>

<rect x="56" y="292" width="130" height="54" rx="6" fill="#ffffff" stroke="#1a7f37" stroke-width="0.8"/>
<text x="121" y="312" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#1f2328">遥控器</text>
<text x="121" y="331" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">手里的摇杆</text>

<rect x="203" y="292" width="130" height="54" rx="6" fill="#ffffff" stroke="#1a7f37" stroke-width="0.8"/>
<text x="268" y="312" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#1f2328">地面站</text>
<text x="268" y="331" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">手机 平板 电脑</text>

<rect x="350" y="292" width="130" height="54" rx="6" fill="#ffffff" stroke="#1a7f37" stroke-width="0.8"/>
<text x="415" y="312" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#1f2328">电源与备件</text>
<text x="415" y="331" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">电池 桨 充电器</text>

<rect x="497" y="292" width="130" height="54" rx="6" fill="#ffffff" stroke="#1a7f37" stroke-width="0.8"/>
<text x="562" y="312" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#1f2328">工具与记录</text>
<text x="562" y="331" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">检查单 飞行日志</text>

<text x="340" y="382" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#57606a">这三块加起来，才叫「无人机系统」（UAS）。飞机只是其中一块</text>

<defs>
<marker id="arb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
</svg>
