<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 310" width="100%" role="img">
<title>遥控、数传、图传三条链路各自的作用与断链后果</title>
<desc>上方为空中无人机，下方为遥控器、地面站、屏幕三台地面设备，三条竖线分别表示遥控指令上行、数传双向、图传视频下行，并注明断链后的不同后果。</desc>

<rect x="0" y="0" width="680" height="310" fill="#ffffff"/>
<text x="340" y="28" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#1f2328">飞机身上有三条独立的链，断了后果完全不同</text>

<rect x="100" y="44" width="460" height="56" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="1"/>
<text x="340" y="76" text-anchor="middle" dominant-baseline="central" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#1f2328">空中 · 无人机</text>

<line x1="130" y1="232" x2="130" y2="106" stroke="#0969da" stroke-width="1.5" marker-end="url(#ar5)"/>
<text x="140" y="150" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">2.4G · 摇杆指令</text>

<line x1="333" y1="232" x2="333" y2="106" stroke="#8250df" stroke-width="1.5" marker-end="url(#ar5)"/>
<line x1="347" y1="106" x2="347" y2="232" stroke="#8250df" stroke-width="1.5" marker-end="url(#ar5o)"/>
<text x="357" y="150" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">2.4G/4G · 遥测</text>

<line x1="550" y1="104" x2="550" y2="232" stroke="#bc4c00" stroke-width="1.5" marker-end="url(#ar5o)"/>
<text x="558" y="150" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">5.8G · 视频</text>

<rect x="40" y="236" width="180" height="54" rx="8" fill="#f5f7fa" stroke="#d8dee6" stroke-width="1"/>
<text x="130" y="258" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1f2328">遥控器</text>
<text x="130" y="277" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#cf222e">断了 → 触发返航</text>

<rect x="250" y="236" width="180" height="54" rx="8" fill="#f5f7fa" stroke="#d8dee6" stroke-width="1"/>
<text x="340" y="258" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1f2328">地面站</text>
<text x="340" y="277" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#bc4c00">断了 → 看不到状态</text>

<rect x="460" y="236" width="180" height="54" rx="8" fill="#f5f7fa" stroke="#d8dee6" stroke-width="1"/>
<text x="550" y="258" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1f2328">屏幕 / 飞行眼镜</text>
<text x="550" y="277" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#cf222e">断了 → 人瞎了，飞机还听话</text>

<defs>
<marker id="ar5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="ar5s" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M8 1L2 5L8 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="ar5o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
</svg>
