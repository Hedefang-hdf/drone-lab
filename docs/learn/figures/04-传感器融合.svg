<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 336" width="100%" role="img">
<title>五个各自不准的传感器经 EKF 融合后输出可信的姿态位置速度</title>
<desc>左侧列出 IMU、GPS、气压计、磁罗盘、光流五种传感器及各自缺点，汇入中间的 EKF 融合环节，右侧输出姿态、位置、速度。</desc>

<rect x="0" y="0" width="680" height="336" fill="#ffffff"/>
<text x="340" y="28" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#1f2328">五个都不准的传感器，凑出一个可信的答案</text>

<rect x="40" y="56" width="150" height="40" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="0.8"/>
<text x="52" y="72" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#1f2328">IMU</text>
<text x="52" y="88" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">反应快，但越算越偏</text>

<rect x="40" y="104" width="150" height="40" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="0.8"/>
<text x="52" y="120" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#1f2328">GPS</text>
<text x="52" y="136" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">不累积误差，但慢、米级</text>

<rect x="40" y="152" width="150" height="40" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="0.8"/>
<text x="52" y="168" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#1f2328">气压计</text>
<text x="52" y="184" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">测高度，怕气流和天气</text>

<rect x="40" y="200" width="150" height="40" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="0.8"/>
<text x="52" y="216" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#1f2328">磁罗盘</text>
<text x="52" y="232" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">定朝向，怕金属和电流</text>

<rect x="40" y="248" width="150" height="40" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="0.8"/>
<text x="52" y="264" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#1f2328">光流 / 视觉</text>
<text x="52" y="280" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">室内用，怕没纹理和暗光</text>

<line x1="200" y1="76" x2="200" y2="268" stroke="#8c959f" stroke-width="1"/>
<line x1="190" y1="76" x2="200" y2="76" stroke="#8c959f" stroke-width="1"/>
<line x1="190" y1="124" x2="200" y2="124" stroke="#8c959f" stroke-width="1"/>
<line x1="190" y1="172" x2="200" y2="172" stroke="#8c959f" stroke-width="1"/>
<line x1="190" y1="220" x2="200" y2="220" stroke="#8c959f" stroke-width="1"/>
<line x1="190" y1="268" x2="200" y2="268" stroke="#8c959f" stroke-width="1"/>
<line x1="200" y1="172" x2="211" y2="172" stroke="#57606a" stroke-width="1.5" marker-end="url(#ar6)"/>

<rect x="215" y="110" width="160" height="130" rx="10" fill="#fbefff" stroke="#8250df" stroke-width="1"/>
<text x="295" y="168" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#1f2328">EKF 融合</text>
<text x="295" y="190" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">谁更可信，就多听谁的</text>

<line x1="375" y1="172" x2="396" y2="172" stroke="#57606a" stroke-width="1.5" marker-end="url(#ar6)"/>

<rect x="400" y="120" width="240" height="110" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="1"/>
<text x="416" y="146" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2328">姿态　roll / pitch / yaw</text>
<text x="416" y="174" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2328">位置　x / y / z</text>
<text x="416" y="202" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2328">速度　vx / vy / vz</text>

<text x="340" y="314" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#57606a">每个传感器都在骗你，只是骗法不一样。融合就是把它们的谎话对一对</text>

<defs>
<marker id="ar6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
</svg>
