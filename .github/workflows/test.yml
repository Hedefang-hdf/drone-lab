name: flight-tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── 任务一：跑飞行回归用例 ──────────────────────────────
  # 同一份日志，三个 Python 版本，证明工具链不挑环境。
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Show test inventory
        run: |
          python -V
          echo "### 用例清单" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python -m pytest --collect-only -q 2>&1 | tail -30 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Run flight regression tests
        run: python -m pytest -v --tb=short --junitxml=junit-${{ matrix.python-version }}.xml

      - name: Generate hover health report
        if: always()
        run: |
          python pytools/ulog_report.py data/20261027-sitl-hover.ulg | tee hover-report.txt
          echo "### 悬停体检报告（py${{ matrix.python-version }}）" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat hover-report.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-result-py${{ matrix.python-version }}
          path: |
            junit-${{ matrix.python-version }}.xml
            hover-report.txt
          retention-days: 30

  # ── 任务二：负向验证 ────────────────────────────────────
  # 一个永远通过的测试用例等于没写。这里故意把标准收紧到不可能达标，
  # 确认断言真的会 FAIL —— 只有能失败的用例，才证明它能发现问题。
  negative-check:
    name: 负向验证（用例能不能发现故障）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run negative check
        run: python scripts/negative_check.py | tee negative-check.txt

      - name: Assert the check actually flipped
        # 负向脚本自身也必须有牙齿：没能让任何一项翻转，就说明用例是哑的。
        run: |
          if grep -q "全部断言有效" negative-check.txt; then
            echo "✅ 收紧标准后，判定按预期翻转 —— 用例有效"
          else
            echo "❌ 收紧标准后判定没有翻转，用例可能是哑的"
            exit 1
          fi

      - name: Summary
        if: always()
        run: |
          echo "### 负向验证" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat negative-check.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "(无输出)"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # ── 任务三：流水线全链路（replay 模式） ─────────────────
  # 飞行部分依赖仿真环境，CI 上跑不动；但"取数 → 测量 → 用例 → 报告"
  # 是纯计算，必须每次提交都验。replay 模式让这条链路在任何机器上秒级回归。
  campaign-replay:
    name: 流水线全链路（replay）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pipeline in replay mode
        run: python scripts/run_campaign.py --replay data/20261027-sitl-hover.ulg --out campaigns/ci

      - name: Assert pipeline verdict
        run: |
          python - <<'PY'
          import json, sys
          m = json.load(open("campaigns/ci/manifest.json"))
          print("verdict:", m["verdict"], "| stages:", len(m["stages"]),
                "| tests:", m["tests"]["passed"], "passed /", m["tests"]["failed"], "failed")
          if m["verdict"] != "PASS":
              sys.exit("流水线判定不是 PASS，检查报告 campaigns/ci/report.html")
          PY

      - name: Upload campaign artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campaign-report
          path: |
            campaigns/ci/report.html
            campaigns/ci/manifest.json
            campaigns/ci/junit.xml
          retention-days: 30

  # ── 任务四：Go 版 ulog2html ──────────────────────────────
  # 纯 Go 实现的 ULog 解析器 + 报告生成器。单测里钉着与 Python 侧一致的数值基准，
  # 两边独立实现算同一份日志必须对得上——这是"协议理解正确"的交叉验证。
  go-report:
    name: ulog2html（Go）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build
        working-directory: gotools
        run: go build ./...

      - name: Test (含与 Python 数值基准的交叉验证)
        working-directory: gotools
        run: go test ./... -v

      - name: Generate HTML report from sample log
        working-directory: gotools
        run: |
          go build -o bin/ulog2html ./cmd/ulog2html
          ./bin/ulog2html ../data/20261027-sitl-hover.ulg -o ../reports/ulog2html.html

      - name: Upload Go report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ulog2html-report
          path: reports/ulog2html.html
          retention-days: 30
